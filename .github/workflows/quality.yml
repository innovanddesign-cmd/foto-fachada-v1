name: Quality and dependency security
on:
  pull_request:
  push:
    branches: [main, codex/innova-commercial-launch]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm audit --audit-level=low
      - run: npm test
      - run: node integration/netlify-runtime/test.cjs
      - run: python3 -B -m unittest discover -s integration/captacion -p 'test_*.py'
      - run: npm run lint
      - run: npm run build
