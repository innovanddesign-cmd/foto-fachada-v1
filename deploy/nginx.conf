# Nginx Configuration for Foto Fachada
# =====================================
# Location: /etc/nginx/sites-available/fotofachada.com
# Enable: ln -s /etc/nginx/sites-available/fotofachada.com /etc/nginx/sites-enabled/
# Test: nginx -t
# Reload: systemctl reload nginx

# Rate limiting zone
limit_req_zone $binary_remote_addr zone=api_limit:10m rate=10r/s;
limit_req_zone $binary_remote_addr zone=ai_limit:10m rate=2r/m;

# Upstream backend (PM2 cluster)
upstream foto_fachada_api {
    server 127.0.0.1:3000;
    keepalive 32;
}

# HTTP -> HTTPS redirect
server {
    listen 80;
    listen [::]:80;
    server_name fotofachada.com www.fotofachada.com app.fotofachada.com;
    
    # ACME challenge for Let's Encrypt
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }
    
    location / {
        return 301 https://$host$request_uri;
    }
}

# Main HTTPS server (Frontend + API)
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name fotofachada.com www.fotofachada.com app.fotofachada.com;
    
    # SSL certificates (Let's Encrypt)
    ssl_certificate /etc/letsencrypt/live/fotofachada.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/fotofachada.com/privkey.pem;
    
    # SSL configuration
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers 'ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384';
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;
    
    # HSTS
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    
    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    
    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types text/plain text/css text/xml text/javascript application/javascript application/json application/xml;
    
    # Root for static files (Vite build output)
    root /var/www/foto-fachada/dist;
    index index.html;
    
    # ─────────────────────────────────────────────────────────────
    # API PROXY
    # ─────────────────────────────────────────────────────────────
    
    # Health check (no rate limit)
    location /health {
        proxy_pass http://foto_fachada_api;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    
    # API routes with rate limiting
    location /api/ {
        limit_req zone=api_limit burst=20 nodelay;
        
        proxy_pass http://foto_fachada_api;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # Timeouts for AI endpoints
        proxy_connect_timeout 60s;
        proxy_send_timeout 120s;
        proxy_read_timeout 120s;
    }
    
    # AI strategy generation (stricter rate limit)
    location /api/strategies/ {
        limit_req zone=ai_limit burst=5 nodelay;
        
        proxy_pass http://foto_fachada_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # Longer timeout for AI calls
        proxy_read_timeout 180s;
    }
    
    # Stripe webhooks (no rate limit, special handling)
    location /api/billing/webhook {
        proxy_pass http://foto_fachada_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # Pass raw body for Stripe signature verification
        proxy_set_header Content-Type $content_type;
    }
    
    # ─────────────────────────────────────────────────────────────
    # STATIC FILES
    # ─────────────────────────────────────────────────────────────
    
    # Assets (long cache)
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }
    
    # Favicon and robots
    location = /favicon.ico {
        expires 1M;
        access_log off;
        log_not_found off;
    }
    
    location = /robots.txt {
        expires 1d;
        access_log off;
    }
    
    # SPA fallback - all other routes go to index.html
    location / {
        try_files $uri $uri/ /index.html;
        
        # Cache control for HTML
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }
    
    # ─────────────────────────────────────────────────────────────
    # ERROR PAGES
    # ─────────────────────────────────────────────────────────────
    
    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
        internal;
    }
}

# Landing pages subdomain (dynamic SEO)
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name *.land.fotofachada.com;
    
    ssl_certificate /etc/letsencrypt/live/fotofachada.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/fotofachada.com/privkey.pem;
    
    # Same root
    root /var/www/foto-fachada/dist;
    index index.html;
    
    # All routes to SPA, which handles dynamic SEO
    location / {
        try_files $uri $uri/ /index.html;
    }
    
    # API proxy
    location /api/ {
        proxy_pass http://foto_fachada_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
