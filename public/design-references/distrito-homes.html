<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Distrito Homes - Inmobiliaria en Benidorm</title>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Serif:wght@600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">

    <!-- Phosphor Icons -->


    <!-- Tailwind CSS (CDN para Hostinger) -->


    <style>
        /* Utilidades personalizadas para el diseño premium */
        body {
            background-color: #00132e;
            -webkit-font-smoothing: antialiased;
        }
        .glass-panel {
            background: rgba(11, 42, 80, 0.85);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
        }
    </style>
<link rel="stylesheet" href="distrito-landing.css"><style>a:focus-visible{outline:3px solid white;outline-offset:4px}svg{width:30px;height:30px;fill:currentColor;flex-shrink:0}@media(prefers-reduced-motion:reduce){*{transition:none!important}}</style></head>
<body class="relative min-h-screen flex flex-col items-center justify-between overflow-x-hidden">

    <!-- Imagen de fondo con gradiente -->
    <div class="absolute inset-0 w-full h-full z-0 fixed">
        <!-- Imagen del Skyline de Benidorm -->
        <img src="./brands/distrito/distrito-skyline.jpg" alt="Benidorm Skyline" class="w-full h-full object-cover object-center" />
        <div class="absolute inset-0 bg-gradient-to-b from-navy-base/80 via-navy-base/30 to-navy-base"></div>
        <!-- Gradiente inferior para asegurar la legibilidad -->
        <div class="absolute inset-x-0 bottom-0 h-3/4 bg-gradient-to-t from-navy-base via-navy-base/90 to-transparent"></div>
    </div>

    <!-- Sección del Logo -->
    <header class="relative z-10 w-full pt-16 pb-6 flex flex-col items-center">
        <img src="./brands/distrito/distrito-logo.png" alt="Distrito Homes Logo" class="h-24 md:h-32 w-auto object-contain drop-shadow-lg" />
    </header>

    <!-- Contenido Principal (Alineado abajo) -->
    <main class="relative z-10 w-full max-w-md px-5 pb-10 mt-auto flex flex-col gap-4">

        <!-- Botón Principal CTA -->
        <a target="_blank" rel="noopener noreferrer" href="https://distritohomes.es/" class="block w-full bg-gold text-white font-sans font-bold text-lg py-4 rounded-md shadow-ambient transition-all duration-500 ease-editorial hover:scale-[1.02] hover:brightness-110 text-center">
            VISITAR WEB
        </a>

        <!-- Grid de 3 Botones -->
        <div class="grid grid-cols-3 gap-3 w-full">
            <a target="_blank" rel="noopener noreferrer" href="https://distritohomes.es/solicitar-valoracion" class="glass-panel rounded-xl p-4 flex flex-col items-center justify-center gap-3 shadow-ambient transition-all duration-500 ease-editorial hover:-translate-y-1 hover:bg-navy-high border border-white/5">
                <svg viewBox="0 0 24 24" aria-hidden="true" class="text-gold text-3xl"><path d="M3 10 12 2l9 8v11h-6v-7H9v7H3z"/></svg>
                <span class="font-sans text-textlight text-[10px] sm:text-xs font-semibold text-center leading-tight tracking-wide">SOLICITAR<br>VALORACIÓN</span>
            </a>
            <a target="_blank" rel="noopener noreferrer" href="https://www.google.com/maps/search/?api=1&amp;query=Calle+Doctor+Perez+Llorca+7+Benidorm" class="glass-panel rounded-xl p-4 flex flex-col items-center justify-center gap-3 shadow-ambient transition-all duration-500 ease-editorial hover:-translate-y-1 hover:bg-navy-high border border-white/5">
                <svg viewBox="0 0 24 24" aria-hidden="true" class="text-gold text-3xl"><path d="M12 2a7 7 0 0 0-7 7c0 5 7 13 7 13s7-8 7-13a7 7 0 0 0-7-7zm0 4a3 3 0 1 1 0 6 3 3 0 0 1 0-6z"/></svg>
                <span class="font-sans text-textlight text-[10px] sm:text-xs font-semibold text-center leading-tight tracking-wide">DÓNDE<br>ESTAMOS</span>
            </a>
            <a href="tel:+34676254552" class="glass-panel rounded-xl p-4 flex flex-col items-center justify-center gap-3 shadow-ambient transition-all duration-500 ease-editorial hover:-translate-y-1 hover:bg-navy-high border border-white/5">
                <svg viewBox="0 0 24 24" aria-hidden="true" class="text-gold text-3xl"><path d="M5 2h4l2 6-3 2a16 16 0 0 0 6 6l2-3 6 2v4a3 3 0 0 1-3 3C9 22 2 15 2 5a3 3 0 0 1 3-3z"/></svg>
                <span class="font-sans text-textlight text-[10px] sm:text-xs font-semibold text-center leading-tight tracking-wide">LLÁMANOS</span>
            </a>
        </div>

        <!-- Tarjeta de Información -->
        <div class="glass-panel rounded-xl p-5 flex items-start gap-4 shadow-ambient border border-white/5">
            <svg viewBox="0 0 24 24" aria-hidden="true" class="text-gold text-3xl shrink-0 mt-1"><path d="M3 10 12 2l9 8v11h-6v-7H9v7H3z"/></svg>
            <div class="font-sans text-textlight text-sm leading-relaxed">
                <p class="mb-3"><strong class="text-white font-semibold">SOBRE NOSOTROS:</strong> Tu agencia inmobiliaria de confianza en Benidorm, especializados en propiedades exclusivas.</p>
            </div>
        </div>

    </main>
</body>
</html>
