# Foto Fachada Nginx Configuration
# ==================================

server {
    listen 80;
    server_name fotofachada.com www.fotofachada.com;
    
    # Redirect HTTP to HTTPS
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name fotofachada.com www.fotofachada.com;

    # SSL Certificates (Managed by Certbot)
    ssl_certificate /etc/letsencrypt/live/fotofachada.com/fullchain.pem; # Placeholder
    ssl_certificate_key /etc/letsencrypt/live/fotofachada.com/privkey.pem; # Placeholder

    # Security Headers
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Frame-Options "SAMEORIGIN";
    add_header X-XSS-Protection "1; mode=block";
    add_header X-Content-Type-Options "nosniff";

    # Gzip Compression
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

    # Dynamic Landing Pages (Subdomains)
    # This block handles *.fotofachada.com
}

server {
    listen 443 ssl http2;
    server_name ~^(?<subdomain>.+)\.fotofachada\.com$;

    ssl_certificate /etc/letsencrypt/live/fotofachada.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/fotofachada.com/privkey.pem;

    location / {
        proxy_pass http://localhost:3000; # Forward to Node.js
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        
        # Pass subdomain header if needed by app
        proxy_set_header X-Forwarded-Subdomain $subdomain;
    }
}

# Main App Proxy
server {
    listen 443 ssl http2;
    server_name app.fotofachada.com;

    ssl_certificate /etc/letsencrypt/live/fotofachada.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/fotofachada.com/privkey.pem;

    location / {
        proxy_pass http://localhost:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
    }
}
